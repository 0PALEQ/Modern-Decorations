import groovy.json.JsonSlurper

def manifest = new JsonSlurper().parse(rootProject.file('../../shared/gradle/source-groups.json'))
def target = rootProject.projectDir.name
if (target.startsWith('fabric_')) {
    sourceSets.main.java.srcDir(rootProject.file('../../shared/code/compat/clock-fabric'))
}
sourceSets.main.java.srcDir(rootProject.file('../../shared/code/common/clock'))
sourceSets.main.java.srcDir(rootProject.file('../../shared/code/common/furniture'))
sourceSets.main.java.srcDir(rootProject.file('../../shared/code/common/migration'))
tasks.named('processResources') {
    inputs.property('bedMigrationRefmap', target in ['fabric_1.20.1', 'forge_1.20.1'])
}
if (target == 'fabric_1.20.1') {
    loom.mixin.defaultRefmapName = 'mdm.refmap.json'
}
if (!(target in ['fabric_1.20.1', 'forge_1.20.1'])) {
    tasks.named('processResources') {
        filesMatching('mdm.mixins.json') {
            filter { line -> line.contains('"refmap"') ? null : line }
        }
    }
}
sourceSets.main.java.srcDir(rootProject.file(project.minecraft_version.toString() in ['1.20.1', '1.21.1']
        ? '../../shared/code/compat/clock-legacy'
        : project.minecraft_version.toString() == '1.21.11'
            ? '../../shared/code/compat/clock-1.21.11' : '../../shared/code/compat/clock-modern'))
manifest.groups.findAll { target in it.versions }.each { group ->
    group.roots.each { kind, path ->
        sourceSets.main."${kind}".srcDir(rootProject.file("../../${path}"))
    }
}

ext.mainSourceFile = { String kind, String relativePath ->
    sourceSets.main."${kind}".srcDirs.collect { new File(it, relativePath) }
            .find { it.isFile() } ?: file("src/main/${kind}/${relativePath}")
}

def translationResourcesPath = layout.buildDirectory.dir('resources/main').get().asFile.absolutePath
tasks.register('verifyTranslations') {
    group = 'verification'
    description = 'Checks every language for complete, nonblank English translation keys.'
    dependsOn tasks.named('processResources')
    inputs.dir(translationResourcesPath)
    doLast {
        def resources = new File(translationResourcesPath)
        def languageDir = new File(resources, 'assets/mdm/lang')
        def parser = new JsonSlurper()
        def english = parser.parse(new File(languageDir, 'en_us.json'))
        languageDir.eachFileMatch(~/.*\.json/) { languageFile ->
            def translations = parser.parse(languageFile)
            def missing = english.keySet() - translations.keySet()
            def blank = translations.findAll { key, value ->
                !(value instanceof String) || value.trim().isEmpty()
            }.keySet()
            if (!missing.isEmpty() || !blank.isEmpty()) {
                throw new GradleException("Incomplete translations in ${languageFile.name}: missing=${missing}, blank=${blank}")
            }
        }
        new File(resources, 'assets/mdm/blockstates').eachFileMatch(~/.*\.json/) { blockstate ->
            def id = blockstate.name.substring(0, blockstate.name.length() - 5)
            if (id != 'furniture_part' && !english.containsKey("block.mdm.${id}".toString())) {
                throw new GradleException("Missing English block translation: ${id}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyTranslations')
}

def clockTestClasses = layout.buildDirectory.dir('clock-test-classes')
tasks.register('compileClockTests', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor(java.toolchain)
    source rootProject.file('../../shared/tests/ClockHandsTest.java')
    source rootProject.file('../../shared/code/common/clock/com/cookiecraftmods/mdm/client/clock/ClockTime.java')
    source rootProject.file('../../shared/code/common/clock/com/cookiecraftmods/mdm/client/clock/ClockHandMesh.java')
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = clockTestClasses
}
tasks.register('verifyClockHands', JavaExec) {
    dependsOn tasks.named('compileClockTests')
    classpath = files(clockTestClasses) + sourceSets.main.compileClasspath
    mainClass = 'ClockHandsTest'
    workingDir rootProject.file('../..')
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
tasks.named('check') {
    dependsOn tasks.named('verifyClockHands')
}

def migrationTestClasses = layout.buildDirectory.dir('migration-test-classes')
tasks.register('compileBedMigrationTests', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor(java.toolchain)
    source rootProject.file('../../shared/tests/LegacyBedMigrationTest.java')
    source rootProject.file('../../shared/code/common/migration/com/cookiecraftmods/mdm/migration/LegacyBedMigration.java')
    classpath = sourceSets.main.compileClasspath
    options.compilerArgs.add('-proc:none')
    destinationDirectory = migrationTestClasses
}
tasks.register('verifyBedMigration', JavaExec) {
    dependsOn tasks.named('compileBedMigrationTests')
    classpath = files(migrationTestClasses) + sourceSets.main.runtimeClasspath
    mainClass = 'LegacyBedMigrationTest'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
tasks.named('check') {
    dependsOn tasks.named('verifyBedMigration')
}
