import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// Compose shared mappings with the small, version-specific rendering settings.
// Keep the resulting resource format unchanged for Minecraft and validators.
def sharedModels = rootProject.file('../../shared/models/block')
def translucencyFile = rootProject.file('../../shared/gradle/translucent-model-slots.json')
def modelDirectories = sourceSets.main.resources.srcDirs.collect {
    new File(it, 'assets/mdm/models/block')
}

def useTextureDescriptors = project.minecraft_version.toString().startsWith('26.')

tasks.named('processResources') {
    inputs.dir(sharedModels)
    inputs.file(translucencyFile)
    inputs.property('useTextureDescriptors', useTextureDescriptors)

    doLast {
        def parse = new JsonSlurper()
        def translucentSlots = parse.parse(translucencyFile)
        def outputModels = new File(destinationDir, 'assets/mdm/models/block')
        sharedModels.eachFileMatch(~/.*\.json/) { mappingFile ->
            def localFile = modelDirectories.collect { new File(it, mappingFile.name) }.find { it.isFile() }
            if (localFile != null) {
                // Read source settings, never a previously composed build output.
                def shared = parse.parse(mappingFile)
                def local = parse.parse(localFile)
                def model = shared + local
                model.textures = (shared.textures ?: [:]) + (local.textures ?: [:])
                if (useTextureDescriptors) {
                    def id = mappingFile.name.substring(0, mappingFile.name.length() - 5)
                    (translucentSlots[id] ?: []).each { slot ->
                        def sprite = model.textures[slot]
                        if (!(sprite instanceof String)) {
                            throw new GradleException("Missing shared texture: ${id}#${slot}")
                        }
                        model.textures[slot] = [force_translucent: true, sprite: sprite]
                    }
                }
                new File(outputModels, mappingFile.name).setText(
                        JsonOutput.prettyPrint(JsonOutput.toJson(model)) + '\n', 'UTF-8')
            }
        }
        ['black_wall_clock', 'wooden_wall_clock'].each { id ->
            def customFile = new File(destinationDir, "assets/mdm/models/custom/${id}.json")
            def complete = parse.parse(customFile)
            def hands = complete.elements.findAll { it.name in ['pointer_hour', 'pointer_minute'] }
            if (hands.size() != 2) {
                throw new GradleException("Clock ${id} needs named hour and minute hands")
            }
            def body = new LinkedHashMap(complete)
            body.elements = complete.elements - hands
            body.remove('groups')
            new File(customFile.parentFile, "${id}_body.json").text = JsonOutput.toJson(body)
            def blockFile = new File(outputModels, "${id}.json")
            def block = parse.parse(blockFile)
            def itemFile = new File(destinationDir, "assets/mdm/models/item/${id}.json")
            def item = parse.parse(itemFile)
            item.parent = "mdm:custom/${id}"
            item.textures = block.textures
            itemFile.text = JsonOutput.toJson(item)
            block.parent = "mdm:custom/${id}_body"
            blockFile.text = JsonOutput.toJson(block)
        }
    }
}

apply from: rootProject.file('../../shared/gradle/light-models.gradle')
