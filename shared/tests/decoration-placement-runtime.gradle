// Fabric 1.21.1: gradle -p versions/fabric_1.21.1 -I shared/tests/decoration-placement-runtime.gradle runServer
gradle.projectsEvaluated {
    def targetProject = gradle.rootProject
    def testMod = targetProject.layout.buildDirectory.dir('decoration-placement-runtime-mod')
    def testRun = targetProject.layout.buildDirectory.dir('decoration-placement-runtime-run')
    targetProject.loom.runs.server.runDir(testRun.get().asFile.absolutePath)
    def prepare = targetProject.tasks.register('prepareDecorationPlacementRuntime', JavaCompile) {
        dependsOn targetProject.tasks.named('classes')
        javaCompiler = targetProject.javaToolchains.compilerFor(targetProject.java.toolchain)
        source targetProject.file('../../shared/tests/runtime/DecorationPlacementRuntimeTest.java')
        classpath = targetProject.sourceSets.main.compileClasspath + targetProject.sourceSets.main.output
        options.compilerArgs.add('-proc:none')
        destinationDirectory = testMod
        doLast {
            new File(testMod.get().asFile, 'fabric.mod.json').text = groovy.json.JsonOutput.toJson([
                schemaVersion: 1, id: 'mdm_decoration_placement_test', version: '1.0.0',
                entrypoints: [main: ['DecorationPlacementRuntimeTest']], depends: [mdm: '*']])
        }
    }
    targetProject.tasks.named('runServer') {
        dependsOn prepare
        classpath += targetProject.files(testMod)
        workingDir testRun
        args 'nogui'
        doFirst {
            testRun.get().asFile.mkdirs()
            new File(testRun.get().asFile, 'eula.txt').text = 'eula=true\n'
            new File(testRun.get().asFile, 'server.properties').text = 'online-mode=false\nserver-port=0\nview-distance=2\nsimulation-distance=2\nlevel-type=minecraft:flat\nmax-tick-time=-1\n'
        }
    }
}
