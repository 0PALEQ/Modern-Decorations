plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
base.archivesName = project.archives_base_name

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}-${project.loader_name}-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()

        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mdm {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


processResources {
    def metadataProperties = [
        mod_version: project.mod_version,
        neo_version: project.neo_version,
        minecraft_version: project.minecraft_version
    ]
    inputs.properties metadataProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadataProperties
    }
}

sourceSets.main.resources {
    srcDir rootProject.file('../../shared/resources/common')
}

sourceSets.main.java {
    srcDir rootProject.file('../../shared/code/minecraft/1.21.1')
}

apply from: rootProject.file('../../shared/gradle/shared-sources.gradle')

apply from: rootProject.file('../../shared/gradle/validate-recipes.gradle')
apply from: rootProject.file('../../shared/gradle/model-mappings.gradle')

apply from: rootProject.file('../../shared/gradle/eqlib.gradle')
