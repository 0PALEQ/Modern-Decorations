import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}-${project.loader_name}-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.register('validateModResources') {
    group = 'verification'
    description = 'Validates Modern Decorations JSON and one-to-one block data files.'
    dependsOn processResources

    doLast {
        def resources = layout.buildDirectory.dir('resources/main').get().asFile
        def parse = new JsonSlurper()
        fileTree(resources) { include '**/*.json' }.each { json ->
            try {
                parse.parse(json)
            } catch (Exception exception) {
                throw new GradleException("Invalid JSON: ${json}", exception)
            }
        }

        def namesIn = { String directory ->
            fileTree(file("${resources}/${directory}")) { include '*.json' }
                    .files.collect { it.name.substring(0, it.name.length() - 5) } as Set
        }

        def blockstates = namesIn('assets/mdm/blockstates')
        def blockModels = namesIn('assets/mdm/models/block')
        def itemModels = namesIn('assets/mdm/models/item')
        def itemDefinitions = namesIn('assets/mdm/items')
        def lootTables = namesIn('data/mdm/loot_table/blocks')
        def recipes = namesIn('data/mdm/recipe') - 'furniture_parts'

        [
                'block models': blockModels,
                'item models': itemModels,
                'item definitions': itemDefinitions,
                'loot tables': lootTables,
                'stonecutting recipes': recipes
        ].each { label, actual ->
            def missing = blockstates - actual
            if (!missing.isEmpty()) {
                throw new GradleException("Missing ${label} for: ${missing.sort().join(', ')}")
            }
        }

        if (recipes != blockstates) {
            throw new GradleException('Stonecutting recipe ids must match blockstate ids exactly')
        }

        if (itemDefinitions != itemModels) {
            throw new GradleException('Minecraft 26.1.2 item definition ids must match item model ids exactly')
        }

        if (!file("${resources}/META-INF/neoforge.mods.toml").exists()
                || file("${resources}/fabric.mod.json").exists()) {
            throw new GradleException('The distributable must contain NeoForge metadata and no Fabric metadata')
        }

        def javaSource = { String relativePath ->
            def source = sourceSets.main.java.srcDirs
                    .collect { new File(it, relativePath) }
                    .find { it.exists() }
            if (source == null) {
                throw new GradleException("Missing Java source: ${relativePath}")
            }
            source
        }

        def fabricJava = sourceSets.main.java.asFileTree.matching { include '**/*.java' }.findAll {
            it.text.contains('net.fabricmc')
        }
        if (!fabricJava.isEmpty()) {
            throw new GradleException("Fabric API references remain in: ${fabricJava*.name.sort().join(', ')}")
        }

        def blockRegistrySource = javaSource('com/cookiecraftmods/mdm/init/MdmModBlocks.java').text
        def registeredBlocks = [] as Set
        (blockRegistrySource =~ /register\("([a-z0-9_]+)",\s*([A-Za-z0-9_]+)::new\)/).each {
            registeredBlocks.add(it[1])
        }
        if (registeredBlocks != blockstates) {
            throw new GradleException('NeoForge block registrations must match blockstate ids exactly')
        }

        def entityBlockIds = [] as Set
        (blockRegistrySource =~ /register\("([a-z0-9_]+)",\s*([A-Za-z0-9_]+)::new\)/).each {
            def blockSource = javaSource("com/cookiecraftmods/mdm/block/${it[2]}.java")
            if (blockSource.text.contains('implements EntityBlock')) {
                entityBlockIds.add(it[1])
            }
        }
        def blockEntityRegistrySource = javaSource('com/cookiecraftmods/mdm/init/MdmModBlockEntities.java').text
        def registeredBlockEntities = [] as Set
        (blockEntityRegistrySource =~ /register\("([a-z0-9_]+)"/).each {
            registeredBlockEntities.add(it[1])
        }
        if (registeredBlockEntities != entityBlockIds) {
            throw new GradleException('Every EntityBlock must have exactly one matching NeoForge block-entity registration')
        }

        def language = parse.parse(file("${resources}/assets/mdm/lang/en_us.json"))
        (itemDefinitions - 'furniture_parts').each { id ->
            def translationKey = "block.mdm.${id}".toString()
            if (!language.containsKey(translationKey)) {
                throw new GradleException("Missing block-item display name: block.mdm.${id}")
            }
        }
        if (!language.containsKey('item.mdm.furniture_parts')) {
            throw new GradleException('Missing item display name: item.mdm.furniture_parts')
        }

        def itemRegistrySource = javaSource('com/cookiecraftmods/mdm/init/MdmModItems.java').text
        if (!itemRegistrySource.contains('RegistryProperties.item().useBlockDescriptionPrefix()')) {
            throw new GradleException('Block items must use their block translation keys on Minecraft 26.1.2')
        }

        fileTree("${resources}/assets/mdm/items") { include '*.json' }.each { definition ->
            def json = parse.parse(definition)
            def id = definition.name.substring(0, definition.name.length() - 5)
            if (json.model?.type != 'minecraft:model' || json.model?.model != "mdm:item/${id}") {
                throw new GradleException("Invalid 26.1.2 item definition: ${definition}")
            }
        }

        def curtainIds = blockstates.findAll { it == 'curtain_rack' || it ==~ /(black|blue|green|grey|red|white)_curtain(_left|_right)?/ }
        def curtainFacings = ['facing=north', 'facing=east', 'facing=south', 'facing=west'] as Set
        curtainIds.each { id ->
            def state = parse.parse(file("${resources}/assets/mdm/blockstates/${id}.json"))
            if ((state.variants.keySet() as Set) != curtainFacings) {
                throw new GradleException("Curtain must remain vertically hung with four horizontal facings: ${id}")
            }
        }

        curtainIds.findAll { it != 'curtain_rack' }.each { id ->
            def model = parse.parse(file("${resources}/assets/mdm/models/block/${id}.json"))
            if (model.textures?.get('1') != 'mdm:block/curtain_rack') {
                throw new GradleException("Curtain rack texture is mapped incorrectly in: ${id}")
            }
        }
        def curtainRackModel = parse.parse(file("${resources}/assets/mdm/models/block/curtain_rack.json"))
        if (curtainRackModel.textures?.get('2') != 'mdm:block/curtain_rack') {
            throw new GradleException('Standalone curtain rack texture is mapped incorrectly')
        }

        fileTree("${resources}/data/mdm/recipe") { include '*.json'; exclude 'furniture_parts.json' }.each { recipe ->
            def json = parse.parse(recipe)
            def id = recipe.name.substring(0, recipe.name.length() - 5)
            if (json.type != 'minecraft:stonecutting' || json.ingredient != 'mdm:furniture_parts'
                    || json.result?.id != "mdm:${id}" || json.result?.count != 1) {
                throw new GradleException("Invalid stonecutting recipe mapping: ${recipe}")
            }
        }

        def furnitureParts = parse.parse(file("${resources}/data/mdm/recipe/furniture_parts.json"))
        if (furnitureParts.type != 'minecraft:crafting_shaped'
                || furnitureParts.key?.a != 'minecraft:cobblestone'
                || furnitureParts.key?.b != '#minecraft:planks'
                || furnitureParts.key?.c != 'minecraft:iron_nugget'
                || furnitureParts.result?.id != 'mdm:furniture_parts') {
            throw new GradleException('Furniture-parts recipe does not use the Minecraft 26.1.2 ingredient schema')
        }

        fileTree("${resources}/assets/mdm/textures/block") { include '*.png' }.each { texture ->
            def image = javax.imageio.ImageIO.read(texture)
            def hasPartialAlpha = false
            for (int y = 0; y < image.height && !hasPartialAlpha; y++) {
                for (int x = 0; x < image.width; x++) {
                    int alpha = (image.getRGB(x, y) >>> 24) & 0xff
                    if (alpha > 0 && alpha < 255) {
                        hasPartialAlpha = true
                        break
                    }
                }
            }
            if (hasPartialAlpha) {
                def textureId = "mdm:block/${texture.name.substring(0, texture.name.length() - 4)}"
                fileTree("${resources}/assets/mdm/models") { include '**/*.json' }.each { model ->
                    def modelJson = parse.parse(model)
                    modelJson.textures?.each { slot, textureEntry ->
                        def referencedTexture = textureEntry instanceof Map ? textureEntry.sprite : textureEntry
                        if (referencedTexture == textureId
                                && (!(textureEntry instanceof Map) || textureEntry.force_translucent != true)) {
                            throw new GradleException("Partially transparent texture slot must use the 26.1.2 force_translucent descriptor: ${model}#${slot}")
                        }
                    }
                }
            }
        }

        if (file("${resources}/data/mdm/tags/blocks").exists()
                || file("${resources}/data/minecraft/tags/blocks").exists()) {
            throw new GradleException('Legacy plural tags/blocks directories are not valid in Minecraft 26.1.2')
        }

        fileTree("${resources}/assets/mdm/models") { include '**/*.json' }.each { model ->
            def json = parse.parse(model)
            if (json.parent != null && !(json.parent instanceof String)) {
                throw new GradleException("Model parent must remain a resource-location string: ${model}")
            }
            if (model.text.contains('"render_type"')) {
                throw new GradleException("Loader-specific render_type remains in ${model}")
            }
        }
    }
}

check.dependsOn tasks.named('validateModResources')

java {
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

sourceSets.main.resources {
    srcDir rootProject.file('../../shared/src/main/resources')
}

sourceSets.main.java {
    srcDir rootProject.file('../../shared/src/mc_26.1.2/java')
}

apply from: rootProject.file('../../shared/gradle/validate-recipes.gradle')
apply from: rootProject.file('../../shared/gradle/model-mappings.gradle')
